# ───────────────────────────────────────────────
# RTS CPI — Full-Stack Docker Compose
# ───────────────────────────────────────────────
# Quick start:
#   docker compose up -d postgres redis rabbitmq
#   docker compose up api
#   docker compose --profile dev up web-dev
#
# Run migrations manually:
#   docker compose exec api alembic upgrade head
#
# Validate RLS:
#   docker compose exec postgres psql -U cpi -d cpi_db -f /scripts/check_rls.sql
#   OR: ./scripts/check_rls.sh
#
# With Superset:
#   docker compose --profile superset up -d superset
# ───────────────────────────────────────────────

services:

  # ════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cpi_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpi}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════
  # BACKEND — FastAPI
  # ════════════════════════════════════════════

  api:
    build:
      context: ./apps/api
      target: dev
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./:/sample_data:ro
    environment: &api-env
      CPI_DATABASE_URL: ${CPI_DATABASE_URL:-postgresql://cpi:cpi_secret@postgres:5432/cpi_db}
      CPI_DATABASE_URL_RLS: ${CPI_DATABASE_URL_RLS:-postgresql://cpi_app:cpi_app_secret@postgres:5432/cpi_db}
      CPI_DEFAULT_TENANT_ID: ${CPI_DEFAULT_TENANT_ID:-a0000000-0000-0000-0000-000000000001}
      CPI_RABBITMQ_URL: ${CPI_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      CPI_REDIS_URL: ${CPI_REDIS_URL:-redis://redis:6379/0}
      CPI_KEK: ${CPI_KEK}  # required — Fernet KEK for app-layer encryption (Phase 1 SFTP)
      CPI_SMTP_ENCRYPTION_KEY: ${CPI_SMTP_ENCRYPTION_KEY}  # required — Fernet master key for smtp_config password at rest (added 2026-05-19)
      CPI_DEBUG: "true"
      # Superset Connection for Dynamic Resolution
      SUPERSET_URL: ${SUPERSET_URL:-http://superset:8088}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASS: ${SUPERSET_ADMIN_PASS:-admin}
      MFA_ENFORCED: ${MFA_ENFORCED:-false}  # Phase 5A DEV cutover (default false; prod compose unaffected)
      # Alerts evaluation targets. Default in code is DA alone (runner.py);
      # 5L added 2026-08-25 with the Liat Air tenant; WM, JY and PW added
      # 2026-08-27; ALT (Sky Airways demo) added 2026-09-01 with the rule manager.
      CPI_ALERTS_TENANT_CODES: ${CPI_ALERTS_TENANT_CODES:-DA,5L,WM,JY,PW,ALT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo "Running Alembic migrations..."
        alembic upgrade head
        echo "Starting uvicorn..."
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ════════════════════════════════════════════
  # FRONTEND — Vite dev / Nginx prod
  # ════════════════════════════════════════════

  web:
    build:
      context: ./apps/web
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_TENANT_ID: ${VITE_TENANT_ID:-a0000000-0000-0000-0000-000000000001}
    restart: always
    ports:
      - "9090:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_TENANT_ID: ${VITE_TENANT_ID:-a0000000-0000-0000-0000-000000000001}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ════════════════════════════════════════════
  # BI — Apache Superset
  # ════════════════════════════════════════════

  superset:
    image: apache/superset:3.1.0
    restart: always
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-rts-cpi-local-dev-key-change-in-prod}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpi}:${POSTGRES_PASSWORD:-cpi_secret}@postgres:5432/${POSTGRES_DB:-cpi_db}
    volumes:
      - ./infra/superset_config.py:/app/superset_config.py:ro
      - superset_home:/app/superset_home
      # ECharts grid.right widened to prevent date/label clipping (see superset-patches/README)
      - ./superset-patches/3871.c687a6d83eaaee71a216.entry.js:/app/superset/static/assets/3871.c687a6d83eaaee71a216.entry.js:ro
      # Zoom fix: restore-zoom falls back to full reset when zoom history is empty (see superset-patches/README)
      - ./superset-patches/8755.b325fab1a4b5f24a84fc.entry.js:/app/superset/static/assets/8755.b325fab1a4b5f24a84fc.entry.js:ro
      # Zoom fix: Echart wrapper preserves dataZoom across notMerge setOption (see superset-patches/README)
      - ./superset-patches/14c3cf97fcb6a0f990f2.chunk.js:/app/superset/static/assets/14c3cf97fcb6a0f990f2.chunk.js:ro
      - ./superset-patches/1c187a0a9fcefc88107c.chunk.js:/app/superset/static/assets/1c187a0a9fcefc88107c.chunk.js:ro
      - ./superset-patches/1ec85bcbb6d2cf6e10ef.chunk.js:/app/superset/static/assets/1ec85bcbb6d2cf6e10ef.chunk.js:ro
      - ./superset-patches/1fee1faa5797751fd6c9.chunk.js:/app/superset/static/assets/1fee1faa5797751fd6c9.chunk.js:ro
      - ./superset-patches/262c25b3f6f7f27f99a2.chunk.js:/app/superset/static/assets/262c25b3f6f7f27f99a2.chunk.js:ro
      - ./superset-patches/2804d456171bf906397e.chunk.js:/app/superset/static/assets/2804d456171bf906397e.chunk.js:ro
      - ./superset-patches/40eaaf35ba3c1e848566.chunk.js:/app/superset/static/assets/40eaaf35ba3c1e848566.chunk.js:ro
      - ./superset-patches/4c1599a194b3d4787f35.chunk.js:/app/superset/static/assets/4c1599a194b3d4787f35.chunk.js:ro
      - ./superset-patches/8ba96a087056d5ea2806.chunk.js:/app/superset/static/assets/8ba96a087056d5ea2806.chunk.js:ro
      - ./superset-patches/a348224739c48b2428cd.chunk.js:/app/superset/static/assets/a348224739c48b2428cd.chunk.js:ro
      - ./superset-patches/ad1ee9250614e7b3704f.chunk.js:/app/superset/static/assets/ad1ee9250614e7b3704f.chunk.js:ro
      - ./superset-patches/ba62dfe2787f02795985.chunk.js:/app/superset/static/assets/ba62dfe2787f02795985.chunk.js:ro
      - ./superset-patches/f619b818057afb41eb4a.chunk.js:/app/superset/static/assets/f619b818057afb41eb4a.chunk.js:ro
      - ./superset-patches/f6f6fba78b433a2dc950.chunk.js:/app/superset/static/assets/f6f6fba78b433a2dc950.chunk.js:ro
      # Airplane fly-across loading spinner replaces loading.gif (see superset-patches/README)
      - ./superset-patches/loading_airplane.gif:/app/superset/static/assets/images/loading.gif:ro
      - ./superset-patches/loading_airplane.gif:/app/superset/static/assets/loading.cff8a5da..gif:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        pip install psycopg2-binary 2>/dev/null
        superset db upgrade
        superset fab create-admin \
          --username $${SUPERSET_ADMIN_USER:-admin} \
          --firstname Admin \
          --lastname User \
          --email admin@rts.local \
          --password $${SUPERSET_ADMIN_PASS:-admin} 2>/dev/null || true
        superset init
        # 2026-08-10 perf: replaced "superset run --with-threads" (Flask dev server,
        # single process) with gunicorn. Postgres served 12 concurrent chart queries in
        # 0.39s while the dev server took 1.86s -- the gap was one GIL-bound process.
        # Workers kept at 4 because the Superset metadata DB is SQLite.
        # Rollback: restore the single "superset run -h 0.0.0.0 -p 8088 --with-threads" line.
        gunicorn --bind 0.0.0.0:8088 --workers 4 --worker-class gthread --threads 20 --timeout 120 --keep-alive 5 --limit-request-line 0 --limit-request-field_size 0 "superset.app:create_app()"
    profiles:
      - superset

  # ════════════════════════════════════════════
  # ASYNC — Celery worker + beat (Phase 2 SFTP)
  # ════════════════════════════════════════════

  worker:
    image: cpi-api
    container_name: cpi-worker-1
    restart: always
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    image: cpi-api
    container_name: cpi-beat-1
    restart: always
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--scheduler", "redbeat.RedBeatScheduler"]
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ════════════════════════════════════════════
  # DEV — SFTP server for local Phase 2 testing
  # ════════════════════════════════════════════

  sftp-dev:
    image: atmoz/sftp:latest
    container_name: cpi-sftp-dev-1
    restart: always
    ports:
      - "2222:22"
    volumes:
      - ./dev-sftp-mount/jy:/home/jydev/upload
      - ./dev-sftp-mount/pw:/home/pwdev/upload
    command: jydev:jydev:1001:1001:upload pwdev:pwdev:1002:1002:upload

  # ════════════════════════════════════════════
  # Reverse proxy — Nginx with self-signed TLS
  # ════════════════════════════════════════════

  nginx:
    image: nginx:1.27-alpine
    container_name: cpi-nginx-1
    restart: always
    ports:
      - "9444:9444"
      - "8444:8444"
      - "8488:8488"
      - "15673:15673"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
      - rabbitmq
    # NOTE: superset is profile-gated (profiles: [superset]); omitted from depends_on
    # to keep compose config valid without the profile. Nginx will reach it at
    # request time on the cpi_default network whenever Superset is running.


volumes:
  pgdata:
  superset_home:
