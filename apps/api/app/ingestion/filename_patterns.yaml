# Filename patterns for the ingestion overhaul.
#
# Each entry recognises a single (tenant_code, domain) combination based on
# a filename regex. The first regex capture group MUST be the date portion;
# date_format names a key in SUPPORTED_DATE_FORMATS in filename_parser.py.
#
# To add a new tenant/domain combination, append a new entry here and set the
# regex/date_format/example fields. No code change is needed unless the
# date format is not already supported.

patterns:
  - regex: "^JY_(\\d{6})\\.xlsx$"
    tenant_code: JY
    domain: AIRLINE
    date_format: DDMMYY
    case_insensitive: true
    example: "JY_010426.xlsx"

  - regex: "^WM_(\\d{6})\\.xlsx$"
    tenant_code: WM
    domain: AIRLINE
    date_format: DDMMYY
    case_insensitive: true
    example: "WM_010426.xlsx"

  - regex: "^JY_VL_(\\d{6})\\.(?i:csv|xlsx)$"
    tenant_code: JY
    domain: VELOCITY
    date_format: DDMMYY
    case_insensitive: false
    example: "JY_VL_010426.CSV"

  - regex: "^PW_(\\d{6})\\.xlsx$"
    tenant_code: PW
    domain: AIRLINE
    date_format: DDMMYY
    case_insensitive: true
    example: "PW_010426.xlsx"

  - regex: "^PW_VL_(\\d{6})\\.(?i:csv|xlsx)$"
    tenant_code: PW
    domain: VELOCITY
    date_format: DDMMYY
    case_insensitive: false
    example: "PW_VL_010426.CSV"

  - regex: "^FJL_(\\d{6})\\.csv$"
    tenant_code: FJL
    domain: CFL
    date_format: DDMMYY
    case_insensitive: true
    example: "FJL_010426.csv"

  - regex: "^WM_VL_(\\d{6})\\.(?i:csv|xlsx)$"
    tenant_code: WM
    domain: VELOCITY
    date_format: DDMMYY
    case_insensitive: false
    example: "WM_VL_010426.CSV"

  # DreamAir. Same layout as PW — the demo data IS PW's source files with the
  # RefAL column rewritten and the filename re-prefixed (see
  # scripts/relabel_pw_files_as_da.py), so the parser needs no new date format.
  - regex: "^DA_(\\d{6})\\.xlsx$"
    tenant_code: DA
    domain: AIRLINE
    date_format: DDMMYY
    case_insensitive: true
    example: "DA_010426.xlsx"

  - regex: "^DA_VL_(\\d{6})\\.(?i:csv|xlsx)$"
    tenant_code: DA
    domain: VELOCITY
    date_format: DDMMYY
    case_insensitive: false
    example: "DA_VL_010426.CSV"

  # Liat Air. Same layout as the other airline feeds; the tenant code is the
  # carrier's real IATA code 5L, so the prefix is digit-first — fine for a
  # filename even though SQL identifiers derived from the tenant use "liat".
  - regex: "^5L_(\\d{6})\\.xlsx$"
    tenant_code: 5L
    domain: AIRLINE
    date_format: DDMMYY
    case_insensitive: true
    example: "5L_010426.xlsx"

  - regex: "^5L_VL_(\\d{6})\\.(?i:csv|xlsx)$"
    tenant_code: 5L
    domain: VELOCITY
    date_format: DDMMYY
    case_insensitive: false
    example: "5L_VL_010426.CSV"
