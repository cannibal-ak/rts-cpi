server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: correct content-type for the web app manifest (nginx mime.types lacks .webmanifest)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # PWA: service worker must always revalidate so updates apply cleanly
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all routes serve index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
