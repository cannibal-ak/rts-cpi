events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 50m;

  # Resolve Docker service names at request time so container rebuilds don't 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WebSocket upgrade map (Superset live features)
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # ── HTTP :80 — ACME challenge + 301 to HTTPS ──
  server {
    listen 80;
    server_name 187.127.130.130.sslip.io bi.187.127.130.130.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
  }

  # ── APP — https://187.127.130.130.sslip.io ──
  server {
    listen 443 ssl;
    http2 on;
    server_name 187.127.130.130.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/187.127.130.130.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/187.127.130.130.sslip.io/privkey.pem;

    set $api http://api:8000;
    set $web http://web:80;

    location /api/ {
      # Frontend issues /api/api/v1/... (BASE=/api + embedded /api/v1 paths).
      # Strip ONE leading /api so the api receives /api/v1/...
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass $web$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── SUPERSET — https://bi.187.127.130.130.sslip.io ──
  server {
    listen 443 ssl;
    http2 on;
    server_name bi.187.127.130.130.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/187.127.130.130.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/187.127.130.130.sslip.io/privkey.pem;

    set $superset http://superset:8088;

    location / {
      proxy_pass $superset$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      # NOTE: deliberately NO "X-Frame-Options: DENY" here — the app must iframe
      # Superset; embedding is governed by Superset Talisman CSP frame-ancestors.
    }
  }

  # AVIADEV DEMO (Navigator AI browser voice) https://aviademo.187.127.130.130.sslip.io
  # ADDITIVE block for browser HTTPS mic. Upstream reached via aviadev-demo_default network.
  server {
    listen 443 ssl;
    http2 on;
    server_name aviademo.187.127.130.130.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/aviademo.187.127.130.130.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aviademo.187.127.130.130.sslip.io/privkey.pem;

    set $aviademo http://aviadev-demo-app:3000;

    location / {
      proxy_pass $aviademo$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }

  # ── ARO AUIP — https://aro-auip.com (ADDITIVE; browser HTTPS mic) ──
  # Routes to the AUIP app container (rbachatbotdemo2-app:3000) via
  # rbachatbotdemo2-network. Does not affect any other server block.
  server {
    listen 80;
    server_name aro-auip.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name aro-auip.com;

    ssl_certificate     /etc/letsencrypt/live/aro-auip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aro-auip.com/privkey.pem;

    set $auip http://rbachatbotdemo2-app:3000;

    location / {
      proxy_pass $auip$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }


  # ── VELOCITY RM AI (VADS) — https://velocity-rm-ai.app (ADDITIVE; added 2026-06-12) ──
  # Routes to VADS via host-published port 8180 (vads-nginx) over the cpi_default
  # bridge gateway 172.18.0.1. cpi-nginx is NOT on the VADS docker network, so the
  # host gateway is used. Does NOT affect any other server block.
  server {
    listen 80;
    server_name velocity-rm-ai.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name velocity-rm-ai.app;

    ssl_certificate     /etc/letsencrypt/live/velocity-rm-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velocity-rm-ai.app/privkey.pem;

    client_max_body_size 200m;

    set $vads http://172.18.0.1:8180;

    location / {
      proxy_pass $vads$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }


  # ── ALTITUDE-AI.APP (altitude-ai.app + bi.altitude-ai.app) — added 2026-06-16 (Phase 1) ──
  # Step C: ACME challenge only. http->https redirect added in Step F once cert exists.
  server {
    listen 80;
    server_name altitude-ai.app bi.altitude-ai.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
  }


  # ── ALTITUDE APP — https://altitude-ai.app (mirrors sslip.io app block) ──
  server {
    listen 443 ssl;
    http2 on;
    server_name altitude-ai.app;

    ssl_certificate     /etc/letsencrypt/live/altitude-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altitude-ai.app/privkey.pem;

    set $api http://api:8000;
    set $web http://web:80;

    location /api/ {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass $web$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── ALTITUDE SUPERSET — https://bi.altitude-ai.app (mirrors sslip.io bi block) ──
  server {
    listen 443 ssl;
    http2 on;
    server_name bi.altitude-ai.app;

    ssl_certificate     /etc/letsencrypt/live/altitude-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altitude-ai.app/privkey.pem;

    set $superset http://superset:8088;

    location / {
      proxy_pass $superset$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }

}
