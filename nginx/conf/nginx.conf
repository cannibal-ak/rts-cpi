worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Shared SSL settings ---
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Logging ---
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Re-resolve container hostnames via Docker's embedded DNS so a
    # `docker compose up --build <svc>` does not leave nginx pinned to
    # a dead upstream IP. valid=10s caps the stale-IP window.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ============================================
    # 1. Frontend (React/Vite) - HTTPS on 9444
    # ============================================
    server {
        listen 9444 ssl;
        server_name 192.168.101.10 localhost;

        # API routed through nginx to avoid mixed-content from HTTPS page.
        # Variable-based proxy_pass does not auto-strip the location prefix,
        # so use rewrite to drop /api/ before forwarding.
        location /api/ {
            set $cpi_api "cpi-api-1:8000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$cpi_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $cpi_web "cpi-web-1:5173";
            proxy_pass http://$cpi_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket support (Vite HMR in dev mode)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ============================================
    # 2. API / Swagger - HTTPS on 8444
    # ============================================
    server {
        listen 8444 ssl;
        server_name 192.168.101.10 localhost;

        location / {
            set $cpi_api "cpi-api-1:8000";
            proxy_pass http://$cpi_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ============================================
    # 3. Superset - HTTPS on 8488
    # ============================================
    server {
        listen 8488 ssl;
        server_name 192.168.101.10 localhost;

        location / {
            set $cpi_superset "cpi-superset-1:8088";
            proxy_pass http://$cpi_superset;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ============================================
    # 4. RabbitMQ Management - HTTPS on 15673
    # ============================================
    server {
        listen 15673 ssl;
        server_name 192.168.101.10 localhost;

        location / {
            set $cpi_rabbitmq "cpi-rabbitmq-1:15672";
            proxy_pass http://$cpi_rabbitmq;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
